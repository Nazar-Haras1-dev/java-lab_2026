server:
  port: 8080

spring:
  application:
    name: library
  datasource:
    url: jdbc:postgresql://localhost:5432/library
    username: library
    password: library
  jpa:
    hibernate:
      ddl-auto: validate      # Hibernate лише ПЕРЕВІРЯЄ схему, створює її Liquibase
    open-in-view: false
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  quartz:
    job-store-type: jdbc
    jdbc:
      initialize-schema: never          # таблиці QRTZ_* створює Liquibase (changeset 002), а не Spring Boot
    overwrite-existing-jobs: true       # нова версія застосунку оновлює визначення, не дублюючи завдань
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org.quartz.scheduler.instanceName: library-scheduler
      org.quartz.threadPool.threadCount: 3
      org.quartz.jobStore.driverDelegateClass: org.quartz.impl.jdbcjobstore.PostgreSQLDelegate
  security:
    oauth2:
      client:
        registration:
          keycloak:
            client-id: library-app
            client-secret: library-secret
            scope: openid,profile,email
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
        provider:
          keycloak:
            issuer-uri: http://localhost:8180/realms/library
            user-name-attribute: preferred_username
      resourceserver:
        jwt:
          issuer-uri: http://localhost:8180/realms/library

library:
  async:
    core-pool-size: 4
    max-pool-size: 8
    queue-capacity: 10
    simulated-delay-ms: 1000     # імітація повільного виклику (лист / PDF / зовнішній сервіс)
    report-timeout-ms: 5000      # максимальне очікування результату в BookReportService
