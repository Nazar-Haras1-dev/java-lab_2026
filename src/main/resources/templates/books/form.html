<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book form</title>
</head>
<body>
<h1 th:text="${book.id == null} ? 'Add book' : 'Edit book'"></h1>

<form th:action="${book.id == null} ? @{/books} : @{/books/{id}(id=${book.id})}"
      th:object="${book}" method="post">
    <p>Title:  <input type="text" th:field="*{title}">
        <span style="color:red" th:if="${#fields.hasErrors('title')}" th:errors="*{title}"></span></p>
    <p>Author: <input type="text" th:field="*{author}">
        <span style="color:red" th:if="${#fields.hasErrors('author')}" th:errors="*{author}"></span></p>
    <p>ISBN:   <input type="text" th:field="*{isbn}">
        <span style="color:red" th:if="${#fields.hasErrors('isbn')}" th:errors="*{isbn}"></span></p>
    <p>Year:   <input type="number" th:field="*{publishedYear}">
        <span style="color:red" th:if="${#fields.hasErrors('publishedYear')}" th:errors="*{publishedYear}"></span></p>
    <button type="submit">Save</button>
    <a th:href="@{/books}">Cancel</a>
</form>
</body>
</html>
