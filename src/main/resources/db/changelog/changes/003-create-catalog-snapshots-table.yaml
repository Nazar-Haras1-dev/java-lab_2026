databaseChangeLog:
  - changeSet:
      id: 003-create-catalog-snapshots-table
      author: student
      changes:
        - createTable:
            tableName: catalog_snapshots
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: snapshot_date
                  type: DATE
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uq_catalog_snapshots_date
              - column:
                  name: book_count
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: source
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP WITH TIME ZONE
                  constraints:
                    nullable: false
