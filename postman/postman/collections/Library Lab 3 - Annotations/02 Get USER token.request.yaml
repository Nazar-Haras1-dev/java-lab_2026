$kind: http-request
url: "{{keycloakUrl}}/realms/library/protocol/openid-connect/token"
method: POST
body:
  type: urlencoded
  content:
    grant_type: password
    client_id: library-app
    client_secret: library-secret
    username: user
    password: user
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.collectionVariables.set('userToken', pm.response.json().access_token);
    language: text/javascript
order: 2000
