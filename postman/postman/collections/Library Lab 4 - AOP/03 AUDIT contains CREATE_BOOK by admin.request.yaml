$kind: http-request
url: "{{baseUrl}}/api/admin/aop-demo/audit"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200', () => pm.response.to.have.status(200));
      pm.test('create audited', () => pm.expect(pm.response.json().some(e => e.action === 'CREATE_BOOK' && e.user === 'admin')).to.be.true);
    language: text/javascript
order: 3000
