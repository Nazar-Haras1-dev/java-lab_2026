$kind: collection
description: ""
variables:
  baseUrl: http://localhost:8080
  keycloakUrl: http://localhost:8180
  adminToken: ""
  bookId: ""
  isbn13: ""
scripts:
  - type: http:beforeRequest
    code: |-
      const d = [9,7,8];
      for (let i = 0; i < 9; i++) { d.push(Math.floor(Math.random() * 10)); }
      const sum = d.reduce((s, x, i) => s + x * (i % 2 === 0 ? 1 : 3), 0);
      const check = (10 - (sum % 10)) % 10;
      pm.collectionVariables.set('isbn13', d.join('') + check);
    language: text/javascript
auth:
  - id: 8980e7e7-36f4-48a3-818e-57a51b695d25
    type: bearer
    name: bearer auth
    credentials:
      token: "{{adminToken}}"
